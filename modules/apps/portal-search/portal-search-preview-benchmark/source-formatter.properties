##
## Exclusions
##
## See https://github.com/liferay/liferay-portal/blob/master/source-formatter.properties
## for available properties.
##

    ##
    ## The benchmark tooling under benchmark-util is Python, shell, YAML and
    ## measurement data with their own conventions. The formatter rewrites
    ## the Python indentation to tabs, which breaks the scripts.
    ##

    source.formatter.excludes=\
        **/benchmark-util/**