##
## LPD-97915 - Search benchmark dataset tier: LARGE
##
## Overlay for benchmarks.properties (sample-sql-builder). It scales only the
## search-relevant content; every other property is inherited from
## benchmarks.properties.
##
## Apply (either option):
##   a) ant -f benchmarks/build.xml build-sample-sql -Dbenchmark.dataset.tier=large
##   b) cp benchmarks/benchmarks-dataset-large.properties \
##          benchmarks/benchmarks.$(whoami).properties
##      ant -f benchmarks/build.xml build-sample-sql
## Then load the generated sample-<db>.sql and reindex.
##
## Approx searchable totals: ~100,000 web contents, ~50,000 users, ~50,000 files,
## ~20,000 commerce products. WARNING: heavy to generate, load and reindex
## (hundreds of thousands of documents) - expect a long run.
##
## NOTE: these numbers are a starting point. The "representative" dataset sizes
## are an open product+eng decision (see the discovery); confirm with the team.
##

# Concentrate content in a single site/company for predictable totals.
sample.sql.max.company.count=1
sample.sql.max.group.count=1

# Web content (total = group x page x count).
sample.sql.max.journal.article.page.count=1
sample.sql.max.journal.article.count=100000

# Users.
sample.sql.max.company.user.count=50000

# Documents & Media (total files = folder.count x file.entry.count at depth 1).
sample.sql.max.dl.folder.depth=1
sample.sql.max.dl.folder.count=100
sample.sql.max.dl.file.entry.count=500
sample.sql.max.dl.file.entry.size=10240

# Commerce products.
sample.sql.max.commerce.product.count=20000

# Blogs.
sample.sql.max.blogs.entry.count=10000
